<header class="bar">
      <div class="container bar-inner">
        <span class="logo">MTWORK</span>
        <div class="actions">
      <!-- left side actions -->
      <div class="hidden md:flex items-center space-x-4">
        
        <!-- Language Toggle -->
        <button 
          (click)="toggleLanguage()" 
          class="flex items-center gap-2 px-4 py-2 text-base rounded-lg hover:bg-gray-100 transition"
          type="button"
          title="Toggle Language"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path>
          </svg>
          <span class="text-gray-700">
            {{ languageService.currentLang() === 'en' ? 'Arabic' : 'EN' }}
          </span>
        </button>

        <!-- Theme Toggle -->
        <button 
          (click)="toggleTheme()" 
          class="p-2 rounded-lg hover:bg-gray-100 transition"
          type="button"
          title="{{ themeService.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode' }}"
          [attr.aria-label]="themeService.isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'">
          @if (themeService.isDarkMode()) {
            <!-- Sun -->
            <svg class="w-6 h-6 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 
              6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 
              0l-.707.707M6.343 17.657l-.707.707M16 
              12a4 4 0 11-8 0 4 4 0 018 0z"></path>
            </svg>
          }
           @else {
            <!-- Moon -->
            <svg class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
              d="M20.354 15.354A9 9 0 018.646 
              3.646 9.003 9.003 0 0012 21a9.003 
              9.003 0 008.354-5.646z"></path>
            </svg>
          }
        </button>
        </div>
      </div></div>
    </header>
