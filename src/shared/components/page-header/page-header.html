<div class="page-header">
  <!-- Breadcrumb -->
  <nav class="breadcrumb" [attr.aria-label]="'common.breadcrumb' | transloco">
    @for (crumb of breadcrumbs; track crumb.label; let last = $last) {
      @if (crumb.route && !last) {
        <a [routerLink]="crumb.route" class="breadcrumb__item breadcrumb__item--link">{{ crumb.label }}</a>
      } @else if (!last) {
        <span class="breadcrumb__item">{{ crumb.label }}</span>
      } @else {
        <span class="breadcrumb__item breadcrumb__item--active">{{ crumb.label }}</span>
      }
      @if (!last) {
        <span class="breadcrumb__sep" aria-hidden="true">›</span>
      }
    }
  </nav>

  <!-- Title row -->
  <div class="page-header__row">
    <h1 class="page-header__title">{{ title }}</h1>
    @if (actionLabel) {
      <button class="page-header__action" (click)="handleAction()" [attr.aria-label]="actionLabel">
        <mat-icon class="page-header__action-icon">{{ actionIcon }}</mat-icon>
        {{ actionLabel }}
      </button>
    }
  </div>
</div>
