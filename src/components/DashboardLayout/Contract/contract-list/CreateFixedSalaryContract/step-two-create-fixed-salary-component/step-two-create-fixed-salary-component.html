<div class="card-section" [formGroup]="contractorForm">
  <h2 class="section-title">Contractor Information</h2>

  <div class="form-row two-columns">
    <div class="form-group">
      <label class="form-label">Full Name <span class="required-badge">Required</span></label>
      <input type="text" class="form-input" formControlName="contractorName" placeholder="e.g. John Smith" />
    </div>
    <div class="form-group">
      <label class="form-label">Nationality <span class="required-badge">Required</span></label>
      <input type="text" class="form-input" formControlName="nationality" placeholder="e.g. American" />
    </div>
  </div>

  <div class="form-row two-columns">
    <div class="form-group">
      <label class="form-label">ID / Passport Number <span class="required-badge">Required</span></label>
      <input type="text" class="form-input" formControlName="idNumber" placeholder="e.g. A12345678" />
    </div>
    <div class="form-group">
      <label class="form-label">Phone Number <span class="required-badge">Required</span></label>
      <input type="tel" class="form-input" formControlName="phoneNumber" placeholder="+1 (555) 000-0000" />
    </div>
  </div>

  <div class="form-row two-columns">
    <div class="form-group">
      <label class="form-label">Email Address <span class="required-badge">Required</span></label>
      <input type="email" class="form-input" formControlName="emailAddress" placeholder="contractor@email.com" />
    </div>
    <div class="form-group">
      <label class="form-label">Job Title</label>
      <input type="text" class="form-input" formControlName="jobTitle" placeholder="e.g. Software Engineer" />
    </div>
  </div>

  <div class="form-group full-width">
    <label class="form-label">Address</label>
    <input type="text" class="form-input" formControlName="address" placeholder="123 Main St, City, Country" />
  </div>
</div>

<div class="card-section" [formGroup]="contractorForm">
  <h2 class="section-title">Banking Details</h2>

  <div class="form-row two-columns">
    <div class="form-group">
      <label class="form-label">Bank Name <span class="required-badge">Required</span></label>
      <input type="text" class="form-input" formControlName="bankName" placeholder="e.g. Chase Bank" />
    </div>
    <div class="form-group">
      <label class="form-label">IBAN <span class="required-badge">Required</span></label>
      <input type="text" class="form-input" formControlName="iban" placeholder="e.g. GB29NWBK60161331926819" />
    </div>
  </div>
</div>
