<div class="card-section" [formGroup]="contractingForm">
  <h2 class="section-title">Contracting</h2>

  <div class="form-row two-columns">
    <div class="form-group">
      <label class="form-label">Start Date <span class="required-badge">Required</span></label>
      <input
        type="date"
        class="form-input"
        formControlName="startDate"
      />
    </div>

    <div class="form-group">
      <label class="form-label">End Date <span class="required-badge">Required</span></label>
      <input
        type="date"
        class="form-input"
        formControlName="endDate"
      />
    </div>
  </div>

  <div class="form-group">
    <label class="form-label">Trial period <span class="required-badge">Required</span></label>
    <input
      type="text"
      class="form-input"
      formControlName="trialPeriod"
      placeholder="e.g. 30 days"
    />
  </div>

  <div class="form-group">
    <label class="form-label">Who has the right to terminate the contract during trial period? <span class="required-badge">Required</span></label>
    <select class="form-input" formControlName="rightToTerminateTrial" [attr.aria-label]="'contracts.wizard.terminateTrial' | transloco">
      <option value="" disabled selected>Select</option>
      @for (option of terminationOptions; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
  </div>

  <div class="form-group">
    <label class="form-label">Who has the right to terminate the contract during the active period? <span class="required-badge">Required</span></label>
    <select class="form-input" formControlName="rightToTerminateDuring" [attr.aria-label]="'contracts.wizard.terminateActive' | transloco">
      <option value="" disabled selected>Select</option>
      @for (option of terminationOptions; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
  </div>

  <div class="form-group">
    <label class="form-label">Who has the right to terminate the contract? <span class="required-badge">Required</span></label>
    <select class="form-input" formControlName="rightToTerminate" [attr.aria-label]="'contracts.wizard.terminateContract' | transloco">
      <option value="" disabled selected>Select</option>
      @for (option of terminationOptions; track option.value) {
        <option [value]="option.value">{{ option.label }}</option>
      }
    </select>
  </div>

  <div class="form-group full-width">
    <label class="form-label">Notice period before contract termination and release</label>
    <textarea
      class="form-input textarea"
      rows="3"
      formControlName="noticePeriod"
      placeholder="e.g. 30 days written notice required"
    ></textarea>
  </div>
</div>
