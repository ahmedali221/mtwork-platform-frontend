<div class="m-5">
  <!-- Button -->
  <a routerLink="/" class="btn btn-primary btn-lg btn-khalli">
    Go to Homepage
  </a><br/>

  <!-- Navigation Hint -->
  <div class="nav-hint">
    <img src="assets/images/navigate-svgrepo.png"
         alt="navigate"
         class="navigateIcon"/>
    <span>Or navigate using Main menu</span>
  </div>
</div>

<div class="container-center text-center">
  <div class="content">
    <!-- 404 Image -->
    <img src="assets/images/Error404.png"
         alt="404 Not Found Error"
         class="error-image mt-4"/>

    <!-- Title -->
    <h2 class="error-title mt-3">404 - Page Not Found</h2>

    <!-- Message -->
    <p class="error-message">
      Sorry, the page you’re looking for doesn’t exist.<br>
      It may have been moved or deleted.
    </p>
  </div>
</div>
