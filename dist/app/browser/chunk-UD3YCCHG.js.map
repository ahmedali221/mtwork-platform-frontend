<div class="container-center text-center">
  <div class="content">
   

    <div class="image-wrap">
      <img src="assets/images/InternalServerError500.png"
           alt="500 Internal Server Error"
           class="error-image" />
    </div>

    <div class="header-500">
      500 - Internal Server Error
    </div>
    <h1 class="error-message">
      Something went wrong on our end
    </h1>

    <p class="error-message">
      We’re working to fix this issue as soon as possible
    </p>

    <p class="mt-3 reach-out">
      <span class="icon-text">
        <img src="assets/images/message-envelope-svgrepo.png"
             alt="message"
             class="icon-inline" />
        Reach out to
        <span class="text-danger fw-bold">Support if it continues</span>
      </span>
    </p>   <br/>

    <button class="btn btn-primary mt-4 btn-khalli" (click)="reloadPage()">
      Please try again later
    </button>
  </div>
</div>
