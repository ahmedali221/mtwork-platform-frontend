<div class="password-requirements">
  <h3 class="requirements-title">Your Password must contain</h3>
  <ul class="requirements-list">
    <li [class.valid]="hasLength" [class.invalid]="passwordValue && !hasLength">
      <i class="fas" [class.fa-check-circle]="hasLength" [class.fa-times-circle]="passwordValue && !hasLength"></i>
      <span>Between 10 and 70 Character</span>
    </li>
    <li [class.valid]="hasUppercase" [class.invalid]="passwordValue && !hasUppercase">
      <i class="fas" [class.fa-check-circle]="hasUppercase" [class.fa-times-circle]="passwordValue && !hasUppercase"></i>
      <span>An uppercase character</span>
    </li>
    <li [class.valid]="hasLowercase" [class.invalid]="passwordValue && !hasLowercase">
      <i class="fas" [class.fa-check-circle]="hasLowercase" [class.fa-times-circle]="passwordValue && !hasLowercase"></i>
      <span>A lowercase character</span>
    </li>
    <li [class.valid]="hasNumber" [class.invalid]="passwordValue && !hasNumber">
      <i class="fas" [class.fa-check-circle]="hasNumber" [class.fa-times-circle]="passwordValue && !hasNumber"></i>
      <span>A Number</span>
    </li>
    <li [class.valid]="hasSpecialChar" [class.invalid]="passwordValue && !hasSpecialChar">
      <i class="fas" [class.fa-check-circle]="hasSpecialChar" [class.fa-times-circle]="passwordValue && !hasSpecialChar"></i>
      <span>A special character</span>
    </li>
  </ul>
</div>
