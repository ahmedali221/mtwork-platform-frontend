 <div class="min-h-screen flex flex-col" style="background: var(--ui-bg); color: var(--ui-text-main);">
      <!-- Navbar / Header -->
      <app-authenticated-header></app-authenticated-header>

      <!-- Layout with sidebar and content -->
      <div class="layout-container" style="display:flex; min-height:calc(100vh - 70px);">
        <app-sidebar></app-sidebar>
        <main
          id="main-content"
          class="main-content"
          [class.sidebar-collapsed]="!sidebarService.isOpen()"
          style="overflow:auto;"
        >
          <router-outlet></router-outlet>
        </main>
      </div>

      <!-- Floating chat widget — fixed position, visible across all dashboard routes -->
      <app-chat-widget></app-chat-widget>
    </div>
