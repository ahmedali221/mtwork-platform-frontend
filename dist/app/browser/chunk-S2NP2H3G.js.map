<div class="container-center text-center">
  <div class="content">

    <!-- 403 Image -->
    <img src="assets/images/Forbidden.png"
         alt="403 Forbidden Error"
         class="error-image"/>

    <!-- Title -->
    <h2 class="error-title mt-4">403 - Forbidden</h2>

    <!-- Message -->
    <p class="error-message">
      You don’t have permission to access this page.<br>
      This could be due to restricted access or missing login credentials.
    </p>

    <!-- Button -->
    <a routerLink="/login" class="btn btn-primary btn-lg mt-3">
      Login to your account
    </a>
  </div>
</div>
